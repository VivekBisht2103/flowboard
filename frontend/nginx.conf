# Serves the SPA and proxies the API on the same origin (no CORS in the default path).
# This is the thin "gateway" in the system diagram; in production it becomes the
# load balancer / API gateway in front of N stateless API replicas.
upstream flowboard_api {
  server api:8080;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /v1/ {
    proxy_pass http://flowboard_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }

  location = /healthz { proxy_pass http://flowboard_api; }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
